{% extends 'base.html' %}{% block content %}<div class="eyebrow">ASSISTANCE INTAKE</div><h1>New graduate assistance record</h1><p>For authorized coordinators. This form does not register anyone on the official electoral roll.</p><form method="post" class="panel form"><input type="hidden" name="_csrf" value="{{csrf_token()}}"><div class="formgrid"><label>Full name *<input name="full_name" maxlength="120" required></label><label>Contact phone *<input name="phone" maxlength="16" required></label><label>District *<input name="district" maxlength="100" value="{{me.district}}" required></label><label>Assembly constituency *<input name="assembly" maxlength="100" value="{{me.assembly}}" required></label><label>Mandal *<input name="mandal" maxlength="100" value="{{me.mandal}}" required></label><label>Booth / polling area<input name="booth" maxlength="100" value="{{me.booth}}"></label><label>Qualification (optional)<input name="qualification" maxlength="100"></label><label>Internal notes<input name="notes" maxlength="300"></label></div><label class="check"><input type="checkbox" name="consent" value="yes" required> The individual has agreed to the collection and internal processing of these details for graduate enrolment assistance and follow-up.</label><button class="primary">Save assistance record</button></form>{% endblock %}
